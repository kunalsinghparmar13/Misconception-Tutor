services:
  misconception-tutor:
    build: .
    container_name: misconception-tutor-app
    ports:
      - "8000:8000"
    environment:
      - BACKEND_HOST=0.0.0.0
      - PORT=8000
      # Model server (see docs/DEPLOY_FREE.md). Put these in a .env file next to this one.
      - LLM_BACKEND_URL=${LLM_BACKEND_URL:-}
      - LLM_BACKEND_TOKEN=${LLM_BACKEND_TOKEN:-}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - TUTOR_DB_PATH=/app/data/tutor.db
    volumes:
      - ./data:/app/data
      - ./LLM/data:/app/LLM/data
    restart: unless-stopped
