version: '3.8'

services:
  misconception-tutor:
    build: .
    container_name: misconception-tutor-app
    ports:
      - "8000:8000"
    environment:
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - PYTHONPATH=/app
    volumes:
      - ./data:/app/data
      - ./LLM/data:/app/LLM/data
    restart: unless-stopped
